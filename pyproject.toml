[project]
name = "brrrl"
version = "0.1.0"
description = "Distributed RL go brrr"
readme = "README.md"
authors = [
    { name = "Sasha Abramowitz", email = "reallysasha@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "jax>=0.10.0",
    "ray>=2.55.1",
    "gymnasium>=1.2.0",
    "numpy>2.0.0",
    "echo>=0.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.6",
    "ty>=0.0.60"
]

[project.scripts]
brrrl = "brrrl:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120

