[project]
name = "brrrl"
version = "0.1.0"
description = "Distributed RL go brrr"
readme = "README.md"
authors = [
    { name = "Sasha Abramowitz", email = "reallysasha@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    # JAX libs
    "jax>=0.10.0",
    "flax>=0.8.1",
    "optax>=0.2.4",
    "orbax-checkpoint>=0.12.0",
    # Number libs
    "numpy>2.0.0",
    # Distributed libs
    "ray>=2.55.1",
    "id-echo>=0.2.0",
    # RL libs
    "gymnasium>=1.2.0",
    "distrax>=0.1.5",
    "rlax>=0.1.9",
    # Other
    "etils[epath]>=1.14.0",
    "tqdm>=4.67",
]

[project.optional-dependencies]
dev = [
    "brrrl[mlflow,wandb]",
    "pre-commit>=4.0",
    "pytest>=7.0",
    "pytest-xdist>=3.6",
    "ruff>=0.6",
    "ty>=0.0.60"
]
mlflow = [
    "mlflow>=3.0",
]
wandb = [
    "wandb>=0.19",
]

[project.scripts]
brrrl = "brrrl:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = ["TID"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.pytest.ini_options]
testpaths = ["tests"]
# One worker per core, grouped by module so a module-scoped fixture is built once. `-n0` to run
# in process, which is quicker for a single file and is what a debugger needs.
addopts = "--strict-markers --strict-config -n auto --dist loadscope"

[tool.codespell]
skip = "uv.lock,*.ipynb,.git,.venv,.ruff_cache"
ignore-words-list = "re-use,nd,ba,meaned"
