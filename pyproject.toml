[project]
name = "brrrl"
version = "0.1.0"
description = "Distributed RL go brrr"
readme = "README.md"
authors = [
    { name = "Sasha Abramowitz", email = "reallysasha@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "jax>=0.10.0",
    "flax>=0.8.1",
    "optax>=0.2.4",
    "ray>=2.55.1",
    "gymnasium>=1.2.0",
    "numpy>2.0.0",
    "id-echo>=0.2.0",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=4.0",
    "pytest>=7.0",
    "ruff>=0.6",
    "ty>=0.0.60"
]

[project.scripts]
brrrl = "brrrl:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = ["TID"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"

[tool.codespell]
skip = "uv.lock,*.ipynb,.git,.venv,.ruff_cache"
ignore-words-list = "re-use,nd,ba"
